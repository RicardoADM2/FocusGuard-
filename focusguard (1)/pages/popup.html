<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface2: #1e1e24;
      --border: #2a2a32;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6df0;
      --accent-glow: rgba(124, 109, 240, 0.15);
      --danger: #f04f4f;
      --success: #4fc47a;
    }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
    }

    /* Toggle */
    .toggle { position: relative; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: var(--muted);
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(16px);
      background: white;
    }

    /* ── Body ── */
    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Status pill */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .status-label { color: var(--muted); font-size: 12px; }

    .status-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      background: rgba(124,109,240,0.1);
      border: 1px solid rgba(124,109,240,0.2);
      border-radius: 5px;
      padding: 2px 8px;
    }

    /* Active unlocks */
    .unlocks-section { display: none; flex-direction: column; gap: 6px; }
    .unlocks-section.visible { display: flex; }

    .unlocks-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .unlock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(79,196,122,0.06);
      border: 1px solid rgba(79,196,122,0.2);
      border-radius: 8px;
      padding: 7px 10px;
    }

    .unlock-site {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--success);
    }

    .unlock-timer {
      font-size: 11px;
      color: var(--muted);
    }

    /* Manage button */
    .manage-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      color: white;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .manage-btn:hover { background: #8f80f5; }
    .manage-btn:active { transform: scale(0.98); }

    .manage-hint {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>🛡️</span>
      <span>FocusGuard</span>
    </div>
    <label class="toggle" title="Enable / disable blocking">
      <input type="checkbox" id="enableToggle" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="body">
    <div class="status-row">
      <span class="status-label">Sites blocked</span>
      <span class="status-count" id="siteCount">—</span>
    </div>

    <div class="unlocks-section" id="unlocksSection">
      <span class="unlocks-title">Temporarily unlocked</span>
      <div id="unlockList"></div>
    </div>

    <button class="manage-btn" id="manageBtn">
      ⚙️ Manage sites &amp; settings
    </button>
    <p class="manage-hint">Opens in a new tab · requires a short countdown</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
